name: Release

# Attaches the integration as solar_illuminance.zip to each published release:
# HACS installs from it, and counts its downloads.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach solar_illuminance.zip to, e.g. 6.0.0
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Check the manifest's version matches the tag
        # The tag may have a leading v, e.g. v6.0.0.
        run: |
          version=$(jq -r .version custom_components/solar_illuminance/manifest.json)
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::manifest.json says $version, but the tag is $TAG"
            exit 1
          fi
      - name: Zip the integration
        # HACS expects the integration's files at the top of the zip.
        working-directory: custom_components/solar_illuminance
        run: zip -r "$GITHUB_WORKSPACE/solar_illuminance.zip" . -x "*__pycache__*"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" solar_illuminance.zip --clobber
