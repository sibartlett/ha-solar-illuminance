name: Feature request
description: Something the integration could do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What you want the sensor to do, and what you'd use it for.
    validations:
      required: true
  - type: textarea
    id: weather
    attributes:
      label: Weather data source
      description: >-
        If it's about a weather source, which integration provides it, and an
        example of its state and attributes from Developer tools → States.
